
---
- name: Instalar Zabbix Agent 2 - Santillana
  hosts: all
  gather_facts: false
  become: true
  serial: 10

  vars:
    zabbix_server_ip: "10.138.120.3"
    zabbix_version: "7.4"
    zabbix_metadata: "linux"

  pre_tasks:
    - name: Detectar Python compatible
      ansible.builtin.raw: |
        for p in /usr/bin/python3.12 /usr/bin/python3.11 \
                 /usr/bin/python3.9 /usr/bin/python3.8 \
                 /usr/libexec/platform-python /usr/bin/python3; do
          if [ -x "$p" ]; then
            echo "$p"
            exit 0
          fi
        done
        exit 1
      register: python_detect
      changed_when: false

    - name: Establecer interprete
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ python_detect.stdout | trim }}"

    - name: Recopilar informacion del sistema
      ansible.builtin.setup:

    - name: Validar sistema operativo
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Rocky', 'AlmaLinux', 'RedHat']
          - ansible_distribution_major_version in ['8', '9', '10']
        fail_msg: "Sistema no soportado por este playbook"

    - name: Definir variables del repositorio
      ansible.builtin.set_fact:
        os_major: "{{ ansible_distribution_major_version }}"
        repo_distro: >-
          {{ {'Rocky':'rocky',
              'AlmaLinux':'alma',
              'RedHat':'rhel'}[ansible_distribution] }}

    - name: Construir URL del repositorio
      ansible.builtin.set_fact:
        zabbix_repo_url: >-
          https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/{{ repo_distro }}/{{ os_major }}/noarch/zabbix-release-latest-{{ zabbix_version }}.el{{ os_major }}.noarch.rpm

  tasks:
    - name: Consultar paquetes instalados
      ansible.builtin.package_facts:
        manager: auto

    - name: Detectar instalacion existente
      ansible.builtin.set_fact:
        zabbix_installed: "{{ 'zabbix-agent2' in ansible_facts.packages }}"

    - name: Mostrar sistema detectado
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Sistema: {{ ansible_distribution }}"
          - "Version: {{ os_major }}"
          - "Agente instalado: {{ zabbix_installed }}"
          - "Repositorio: {{ zabbix_repo_url }}"

    - name: Instalar y configurar repositorio
      when: not zabbix_installed
      block:
        - name: Verificar disponibilidad del RPM
          ansible.builtin.uri:
            url: "{{ zabbix_repo_url }}"
            method: GET
            status_code: 200
            return_content: false
            timeout: 30

        - name: Instalar repositorio Zabbix
          ansible.builtin.dnf:
            name: "{{ zabbix_repo_url }}"
            state: present
            disable_gpg_check: false

        - name: Actualizar cache DNF
          ansible.builtin.dnf:
            update_cache: true

        - name: Instalar Zabbix Agent 2
          ansible.builtin.dnf:
            name: zabbix-agent2
            state: present

    - name: Configurar Zabbix Agent 2
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^\s*#?\s*{{ item.key }}='
        line: "{{ item.key }}={{ item.value }}"
        insertafter: EOF
        backup: true
      loop:
        - key: Server
          value: "{{ zabbix_server_ip }}"
        - key: ServerActive
          value: "{{ zabbix_server_ip }}"
        - key: Hostname
          value: "{{ inventory_hostname }}"
        - key: HostMetadata
          value: "{{ zabbix_metadata }}"
      notify: Reiniciar agente

    - name: Consultar estado de firewalld
      ansible.builtin.command: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: Abrir puerto TCP 10050
      ansible.builtin.command: >
        firewall-cmd --permanent --add-port=10050/tcp
      register: firewall_rule
      when: firewalld_status.stdout == "active"
      changed_when: "'ALREADY_ENABLED' not in firewall_rule.stderr"
      notify: Recargar firewall

    - name: Aplicar cambios pendientes
      ansible.builtin.meta: flush_handlers

    - name: Habilitar e iniciar agente
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: true
        state: started

    - name: Verificar estado del agente
      ansible.builtin.command: systemctl is-active zabbix-agent2
      register: agent_status
      changed_when: false

    - name: Resultado final
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} |
          {{ ansible_distribution }} {{ os_major }} |
          Zabbix Agent 2: {{ agent_status.stdout }}

  handlers:
    - name: Recargar firewall
      ansible.builtin.command: firewall-cmd --reload

    - name: Reiniciar agente
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted