---
- name: Sincronizar tiempo NTP con Windows
  hosts: all
  become: yes
  gather_facts: false
  tasks:

    - name: 1. Validar si ya está configurado el servidor Windows
      ansible.builtin.command: grep -q "10.138.120.13" /etc/chrony.conf
      register: ya_configurado
      failed_when: false
      changed_when: false
      check_mode: no

    - name: 2. Comentar la línea del pool original de internet
      ansible.builtin.replace:
        path: /etc/chrony.conf
        regexp: '^(pool 2.rocky.pool.ntp.org.*)'
        replace: '# \1'
      when: ya_configurado.rc != 0

    - name: 3. Inyectar las IPs de los servidores Windows de Santillana
      ansible.builtin.blockinfile:
        path: /etc/chrony.conf
        marker: "# {mark} CONFIGURACION NTP WINDOWS SANTILLANA"
        block: |
          server 10.138.120.13 iburst prefer
          server 10.138.120.102 iburst
      when: ya_configurado.rc != 0

    - name: 4. Habilitar y reiniciar el servicio chronyd
      ansible.builtin.service:
        name: chronyd
        enabled: yes
        state: restarted
      when: ya_configurado.rc != 0

    - name: 5. Forzar el salto de tiempo inmediato hacia Windows
      ansible.builtin.command: chronyc -a makestep
      when: ya_configurado.rc != 0

    - name: 6. Verificar estado de la sincronización (Se ejecuta siempre)
      ansible.builtin.command: chronyc tracking
      register: time_status
      changed_when: false

    - name: 7. Mostrar resultado en consola
      ansible.builtin.debug:
        msg: 
          - "Servidor: {{ inventory_hostname }}"
          - "Estado: {{ 'Omitido (Ya estaba configurado)' if ya_configurado.rc == 0 else 'Configuración aplicada ahora' }}"
          - "{{ time_status.stdout_lines | select('match', '^(Reference ID|System time).*') | list }}"
