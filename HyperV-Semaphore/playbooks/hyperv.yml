# UNICO PUNTO DE ENTRADA: Semaphore ejecuta este archivo para todas las operaciones.
# Windows: Autounattend en ISO UEFI. Rocky: Install predeterminado + KS en OEMDRV.
- name: Hyper-V - un solo flujo para Windows y Rocky
  hosts: '{{ hyperv_host | default(''SMXHYPVA'') }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Validar operacion y sistema seleccionados
    ansible.builtin.assert:
      that:
      - ansible_play_hosts_all | length == 1
      - accion in ['crear_base', 'clonar', 'diagnosticar', 'finalizar_base', 'recuperar_reserva', 'limpiar']
      - vm_os in ['Windows', 'Rocky']
      - accion != 'limpiar' or vm_os == 'Windows'
  - name: Aplicar valores base; las variables del formulario tienen prioridad
    ansible.builtin.set_fact:
      hyperv_host: '{{ inventory_hostname }}'
      vm_name: '{{ nombre_vm | default(''TPL-WS2025'' if vm_os == ''Windows'' else ''TPL-ROCKY9'', true) }}'
      template_id: '{{ ''ws2025-base-v1'' if vm_os == ''Windows'' else ''rocky9-base-v1'' }}'
      vm_ip: '{{ direccion_ip | default(base_install_ip, true) }}'
      vm_vlan: '{{ base_install_vlan }}'
      vm_mask: 24
      memory_gb: '{{ 8 if vm_os == ''Windows'' else 4 }}'
      cpu: 4
      disk_gb: 100
      v_switch: SETvSwitch
      vm_image_index: 2
      solo_base: true
      windows_ui_language: '{{ windows_language | default(''en-US'', true) }}'
      windows_admin_user: '{{ windows_account | default(''Administrator'', true) }}'
      hv_iso_path: '{{ installation_iso_path | default((iso_path | default(windows_iso_default, true)) if vm_os == ''Windows'' else (rocky_iso_path
        | default(rocky_iso_default, true)), true) }}'
  - name: Exigir contrasena root de la base Rocky antes de reservar IP
    ansible.builtin.assert:
      that:
      - root_password | default('', true) | length > 0
      fail_msg: Introduce la contrasena root de Rocky; el usuario adicional se crea solo al clonar.
    when: accion == 'crear_base' and vm_os == 'Rocky'
    no_log: true
  - name: Comprobar herramientas de Rocky antes de reservar la IP o copiar ISO
    ansible.builtin.command:
      argv: [python3, -m, pip, --version]
    delegate_to: localhost
    changed_when: false
    when: accion in ['crear_base', 'clonar'] and vm_os == 'Rocky'
  - name: Crear espacio de dependencias sin privilegios para preparar Rocky
    ansible.builtin.tempfile:
      state: directory
      prefix: hyperv-iso-libs-
    delegate_to: localhost
    register: rocky_iso_dependencies
    when: accion in ['crear_base', 'clonar'] and vm_os == 'Rocky'
  - name: Consultar tamano ISO Rocky antes de reservar la IP
    ansible.windows.win_powershell:
      script: |
        param([string]$IsoPath,[PSCredential]$NasCredential)
        $Ansible.Changed=$false
        $drive=$null
        try {
            $source=$IsoPath
            if ($NasCredential) {
                if ($IsoPath -notmatch '^\\\\([^\\]+)\\([^\\]+)\\(.+)$') { throw 'La ISO requiere ruta UNC completa.' }
                $share='\\'+$Matches[1]+'\'+$Matches[2]
                $relative=$Matches[3]
                $name='ISO'+[guid]::NewGuid().ToString('N').Substring(0,8)
                $drive=New-PSDrive -Name $name -PSProvider FileSystem -Root $share -Credential $NasCredential -Scope Script
                $source=$name+':\'+$relative
            }
            $file=Get-Item -LiteralPath $source -ErrorAction Stop
            if ($file.PSIsContainer -or $file.Extension -ne '.iso') { throw 'Se requiere un archivo ISO.' }
            $Ansible.Result=@{bytes=$file.Length}
        } finally { if ($drive) { Remove-PSDrive -Name $drive.Name -Force } }
      parameters:
        IsoPath: '{{ hv_iso_path }}'
      sensitive_parameters: '{{ [{''name'': ''NasCredential'', ''username'': nas_user, ''password'': nas_pass}] if nas_user | length > 0 else [] }}'
      error_action: stop
    register: rocky_source_size
    when: accion == 'crear_base' and vm_os == 'Rocky'
  - name: Verificar espacio del runner para dos copias ISO antes de reservar IP
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - 'import shutil,sys; need=int(sys.argv[2])*2+1073741824; free=shutil.disk_usage(sys.argv[1]).free; print("Espacio disponible:",free,"requerido:",need); sys.exit(0 if free>=need else 1)'
      - '{{ rocky_iso_dependencies.path }}'
      - '{{ rocky_source_size.result.bytes }}'
    delegate_to: localhost
    changed_when: false
    when: accion == 'crear_base' and vm_os == 'Rocky'
  - name: Preparar bibliotecas de ISO en el espacio temporal del runner
    ansible.builtin.command:
      argv:
      - python3
      - -m
      - pip
      - install
      - --disable-pip-version-check
      - --no-cache-dir
      - --target
      - '{{ rocky_iso_dependencies.path }}'
      - -r
      - '{{ playbook_dir }}/../requirements-iso.txt'
    delegate_to: localhost
    when: accion in ['crear_base', 'clonar'] and vm_os == 'Rocky'
  - name: Preparar hashes Rocky antes de reservar IP o crear discos
    when: accion in ['crear_base', 'clonar'] and vm_os == 'Rocky'
    block:
    - name: Generar hashes en Python aislado sin depender de passlib global
      ansible.builtin.command:
        argv:
        - python3
        - '{{ playbook_dir }}/../scripts/hash_rocky_passwords.py'
        stdin: "{{ ({'root': root_password} if accion == 'crear_base' else {'root': root_password, 'user': linux_password}) | to_json }}"
      environment:
        PYTHONPATH: '{{ rocky_iso_dependencies.path }}'
      delegate_to: localhost
      changed_when: false
      register: rocky_password_hashes
      no_log: true
    always:
    - name: Retirar dependencias de hashes del clon
      ansible.builtin.file:
        path: '{{ rocky_iso_dependencies.path }}'
        state: absent
      delegate_to: localhost
      when: accion == 'clonar'
  - name: Mostrar herramientas disponibles en el runner sin modificarlo
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - 'import sys,importlib.util; print("Python:",sys.version.split()[0]); print("passlib disponible para hashes:",importlib.util.find_spec("passlib") is not None)'
    delegate_to: localhost
    changed_when: false
    register: runner_tools
    when: accion == 'diagnosticar'
  - name: Informar herramientas del runner
    ansible.builtin.debug:
      var: runner_tools.stdout_lines
    when: accion == 'diagnosticar'
- name: Reservar la IP temporal antes de crear una base
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion crear_base
    when: accion == 'crear_base'
    block:
    - name: Validar base dedicada y catalogo
      ansible.builtin.assert:
        that:
        - ansible_play_hosts_all | length == 1
        - vm_name is match('^TPL-[a-zA-Z0-9-]+$')
        - template_id in template_catalog
        - template_catalog[template_id].system == vm_os
        - vm_vlan | int == base_install_vlan | int
        - vm_ip == base_install_ip
        - vm_gateway | default('') | length > 0
        - vm_dns1 | default('') | length > 0
        fail_msg: La base requiere nombre TPL-, version del catalogo y red de instalacion completa.
    - name: Comprobar que esta version aun no esta publicada
      ansible.windows.win_stat:
        path: '{{ template_library }}\{{ template_id }}\metadata.json'
      register: existing_base
    - name: Evitar reinstalar una base que ya esta publicada
      ansible.builtin.assert:
        that:
        - not existing_base.stat.exists
        fail_msg: Esta base ya existe. Usa la tarea VM desde plantilla; no hace falta instalar otra vez.
    - name: Bloquear la IP compartida entre las dos tareas BASE
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Bloquear-IPBase.ps1'
        error_action: stop
        parameters:
          Action: Reservar
          Library: '{{ template_library }}'
          VmName: '{{ vm_name }}'
          IPAddress: '{{ vm_ip }}'
          CsvVolumes: '{{ csv_volumes }}'
      register: base_ip_lock
- name: Crear una VM nueva y su rol de alta disponibilidad
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  pre_tasks:
  - name: Operacion crear_base
    when: accion == 'crear_base'
    block:
    - name: Exigir un solo nodo ejecutor y los parametros de la VM
      ansible.builtin.assert:
        that:
        - ansible_play_hosts_all | length == 1
        - vm_os in ['Windows', 'Rocky']
        - vm_name is defined
        - vm_name is match('^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$')
        - memory_gb | default(0) | int >= 4
        - cpu | default(0) | int >= 1
        - cpu | int <= 64
        - disk_gb | default(0) | int >= 100
        - vm_vlan | int >= 0
        - vm_vlan | int <= 4094
        - vm_ip is defined
        - vm_mask is defined
        - vm_gateway is defined
        - vm_dns1 is defined
        fail_msg: Selecciona un unico nodo y completa nombre, recursos y parametros IPv4.
    - name: Validar datos exclusivos de Windows
      ansible.builtin.assert:
        that:
        - vm_name | length <= 15
        - vm_image_index | default(0) | int >= 1
        - admin_password | length > 0
        fail_msg: Windows requiere nombre de hasta 15 caracteres, indice real de ISO y contrasena.
      when: vm_os == 'Windows'
      no_log: true
    - name: Validar secretos de Rocky
      ansible.builtin.assert:
        that:
        - root_password | length > 0
        fail_msg: Rocky requiere tu contrasena root para instalar y verificar la base.
      when: vm_os == 'Rocky'
      no_log: true
    - name: Validar credenciales opcionales de NAS
      ansible.builtin.assert:
        that:
        - (nas_user | length > 0) == (nas_pass | length > 0)
        fail_msg: Proporciona usuario y contrasena NAS juntos, o ninguno para usar la cuenta delegada.
      no_log: true
  tasks:
  - name: Operacion crear_base
    when: accion == 'crear_base'
    block:
    - name: Validar cluster y copiar ISO de instalacion al CSV
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Preparar-Despliegue.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          ClusterNodes: '{{ cluster_nodes }}'
          CsvVolumes: '{{ csv_volumes }}'
          SwitchName: '{{ v_switch | default(default_switch, true) }}'
          IsoPath: '{{ hv_iso_path }}'
          DiskBytes: '{{ (disk_gb | int) * 1073741824 }}'
          ReserveBytes: '{{ (reserve_gb | int) * 1073741824 }}'
          IsoCopies: '{{ 3 if vm_os == ''Windows'' and windows_automatic_boot | bool else 2 if vm_os == ''Rocky'' else 1 }}'
          OscdimgPath: '{{ oscdimg_path }}'
        sensitive_parameters: '{{ [{''name'': ''NasCredential'', ''username'': nas_user, ''password'': nas_pass}] if nas_user | length > 0 else
          [] }}'
      register: deployment
    - name: Copiar generador y plantillas al directorio restringido
      ansible.windows.win_copy:
        src: '{{ playbook_dir }}/../files/bootstrap/'
        dest: '{{ deployment.result.stage }}\'
    - name: Guardar parametros sin contrasenas
      ansible.windows.win_copy:
        content: '{{ {''vm_name'': vm_name, ''vm_ip'': vm_ip, ''vm_mask'': vm_mask, ''vm_gateway'': vm_gateway, ''vm_dns1'': vm_dns1, ''vm_dns2'':
          vm_dns2, ''vm_image_index'': vm_image_index | default(0), ''linux_user'': linux_user, ''rdp_port'': rdp_port, ''windows_ui_language'':
          windows_ui_language, ''windows_admin_user'': windows_admin_user, ''solo_base'': solo_base | default(false) | bool} | to_nice_json }}'
        dest: '{{ deployment.result.stage }}\vm.json'
    - name: Generar respuestas de Windows sin prompts interactivos
      ansible.windows.win_powershell:
        script: |
          param([string]$Stage, [Security.SecureString]$AdminPassword)
          & (Join-Path $Stage 'Generar-Respuestas.ps1') -Sistema Windows -Configuracion (Join-Path $Stage 'vm.json') -Salida (Join-Path $Stage 'answers') -AdminPassword $AdminPassword
        error_action: stop
        parameters:
          Stage: '{{ deployment.result.stage }}'
        sensitive_parameters:
        - name: AdminPassword
          value: '{{ admin_password }}'
      when: vm_os == 'Windows'
      no_log: true
    - name: Generar Kickstart con hashes SHA512 sin prompts interactivos
      ansible.windows.win_powershell:
        script: |
          param([string]$Stage, [Security.SecureString]$RootHash)
          & (Join-Path $Stage 'Generar-Respuestas.ps1') -Sistema Rocky -Configuracion (Join-Path $Stage 'vm.json') -Salida (Join-Path $Stage 'answers') -RootPasswordHash $RootHash
        error_action: stop
        parameters:
          Stage: '{{ deployment.result.stage }}'
        sensitive_parameters:
        - name: RootHash
          value: '{{ (rocky_password_hashes.stdout | from_json).root }}'
      when: vm_os == 'Rocky'
      no_log: true
    - name: Integrar respuestas en la ISO UEFI Windows sin pulsar una tecla
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Crear-ISOWindowsSinTecla.ps1'
        error_action: stop
        parameters:
          Root: '{{ deployment.result.root }}'
          VmName: '{{ vm_name }}'
          CsvVolumes: '{{ csv_volumes }}'
          OscdimgPath: '{{ oscdimg_path }}'
          NoPromptBootFile: '{{ efisys_noprompt_path }}'
          AnswersPath: '{{ deployment.result.stage }}\answers'
      register: windows_no_prompt
      when: vm_os == 'Windows' and windows_automatic_boot | bool
    - name: Preparar ISO Rocky que selecciona Install sin teclado
      when: vm_os == 'Rocky'
      block:
      - name: Crear espacio privado temporal en el runner
        ansible.builtin.tempfile:
          state: directory
          prefix: hyperv-rocky-
        delegate_to: localhost
        register: rocky_media_work
      - name: Obtener copia local de la ISO de este despliegue
        ansible.builtin.fetch:
          src: '{{ deployment.result.os_iso }}'
          dest: '{{ rocky_media_work.path }}/source.iso'
          flat: true
      - name: Fijar Install Rocky por defecto y localizar KS en OEMDRV
        ansible.builtin.command:
          argv:
          - python3
          - '{{ playbook_dir }}/../scripts/preparar_rocky_iso.py'
          - --source
          - '{{ rocky_media_work.path }}/source.iso'
          - --output
          - '{{ rocky_media_work.path }}/rocky-auto.iso'
        delegate_to: localhost
        environment:
          PYTHONPATH: '{{ rocky_iso_dependencies.path }}'
      - name: Transferir la ISO automatica al directorio restringido
        ansible.windows.win_copy:
          src: '{{ rocky_media_work.path }}/rocky-auto.iso'
          dest: '{{ deployment.result.stage }}\rocky-auto.iso'
      - name: Publicar el medio con lectura para Hyper-V y conservar ACL restringida
        ansible.windows.win_powershell:
          script: |
            param([string]$Root)
            $source=Join-Path $Root 'Provisioning\rocky-auto.iso'
            $target=Join-Path $Root 'Media\os-uefi-auto.iso'
            if (Test-Path -LiteralPath $target) { throw 'La ISO automatica ya existe.' }
            $acl=Get-Acl -LiteralPath $source
            $acl.AddAccessRule([Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new('S-1-5-83-0'),'ReadAndExecute','Allow'))
            Set-Acl -LiteralPath $source -AclObject $acl
            Move-Item -LiteralPath $source -Destination $target
            $Ansible.Result=@{iso=$target}
          parameters:
            Root: '{{ deployment.result.root }}'
          error_action: stop
        register: rocky_no_prompt
      always:
      - name: Retirar archivos privados del runner al terminar esta preparacion
        ansible.builtin.file:
          path: '{{ rocky_media_work.path }}'
          state: absent
        delegate_to: localhost
        when: rocky_media_work.path is defined
      - name: Retirar bibliotecas temporales de esta preparacion
        ansible.builtin.file:
          path: '{{ rocky_iso_dependencies.path }}'
          state: absent
        delegate_to: localhost
        when: rocky_iso_dependencies.path is defined
    - name: Crear medios, VM y rol HA; iniciar instalacion
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Crear-VMCluster.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          Sistema: '{{ vm_os }}'
          Root: '{{ deployment.result.root }}'
          SwitchName: '{{ v_switch | default(default_switch, true) }}'
          OscdimgPath: '{{ oscdimg_path }}'
          MemoryBytes: '{{ (memory_gb | int) * 1073741824 }}'
          DiskBytes: '{{ (disk_gb | int) * 1073741824 }}'
          CpuCount: '{{ cpu | int }}'
          OsIsoPath: '{{ windows_no_prompt.result.iso if vm_os == ''Windows'' and windows_automatic_boot | bool else rocky_no_prompt.result.iso
            if vm_os == ''Rocky'' else deployment.result.os_iso }}'
          VlanId: '{{ vm_vlan | int }}'
      register: created_vm
  - name: Recuperar la base instalada sin reinstalar
    when: accion == 'finalizar_base'
    block:
    - name: Validar la reserva y la identidad de la base existente
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Reanudar-Base.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          Sistema: '{{ vm_os }}'
          IPAddress: '{{ vm_ip }}'
          Library: '{{ template_library }}'
          TemplateId: '{{ template_id }}'
          CsvVolumes: '{{ csv_volumes }}'
      register: resumed_base
      no_log: true
    - name: Recuperar las rutas y reserva para completar la misma base
      ansible.builtin.set_fact:
        deployment:
          result:
            root: '{{ resumed_base.result.root }}'
            csv: '{{ resumed_base.result.csv }}'
        base_ip_lock:
          result:
            token: '{{ resumed_base.result.token }}'
      no_log: true
  - name: Registrar la base nueva o existente para verificarla otra vez
    when: accion in ['crear_base', 'finalizar_base']
    block:
    - name: Crear archivo temporal de huellas SSH exclusivo de esta tarea
      ansible.builtin.tempfile:
        state: file
        prefix: semaphore-hyperv-knownhosts-
      delegate_to: localhost
      when: vm_os == 'Rocky'
      register: ssh_hosts_file
    - name: Registrar invitado para verificar instalacion mediante autenticacion
      ansible.builtin.add_host:
        name: hv_semaphore_guest
        groups: hv_semaphore_guests
        ansible_host: '{{ vm_ip }}'
        ansible_connection: '{{ ''winrm'' if vm_os == ''Windows'' else ''ssh'' }}'
        ansible_port: '{{ 5985 if vm_os == ''Windows'' else 22 }}'
        ansible_user: '{{ windows_admin_user if vm_os == ''Windows'' else ''root'' }}'
        ansible_password: '{{ admin_password if vm_os == ''Windows'' else root_password }}'
        ansible_winrm_transport: ntlm
        ansible_winrm_message_encryption: always
        ansible_ssh_common_args: '{{ '''' if vm_os == ''Windows'' else ''-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile='' + ssh_hosts_file.path
          }}'
        expected_vm_name: '{{ vm_name }}'
        expected_vm_ip: '{{ vm_ip }}'
        expected_system: '{{ vm_os }}'
        guest_install_timeout: '{{ install_timeout }}'
      no_log: true
- name: Esperar y verificar el sistema instalado
  hosts: hv_semaphore_guests
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Operacion crear_base
    when: accion in ['crear_base', 'finalizar_base']
    block:
    - name: Esperar conexion autenticada desde el runner de Semaphore
      ansible.builtin.wait_for_connection:
        timeout: '{{ guest_install_timeout | int }}'
        sleep: 15
        connect_timeout: 10
    - name: Verificar marcador, nombre y direccion de Windows
      ansible.windows.win_powershell:
        script: |
          param([string]$ExpectedName, [string]$ExpectedIP)
          $Ansible.Changed = $false
          if (-not (Test-Path 'C:\plantilla-lista.txt')) { throw 'No termino la configuracion de Windows.' }
          if ($env:COMPUTERNAME -ne $ExpectedName) { throw 'El nombre Windows no coincide con el solicitado.' }
          if (-not (Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -eq $ExpectedIP)) { throw 'La IP Windows no coincide.' }
        parameters:
          ExpectedName: '{{ expected_vm_name }}'
          ExpectedIP: '{{ expected_vm_ip }}'
        error_action: stop
      when: expected_system == 'Windows'
      register: windows_verified
      until: windows_verified is succeeded
      retries: 20
      delay: 5
    - name: Verificar marcador de instalacion completa de Rocky
      ansible.builtin.command: cat /etc/semaphore-provisioning-complete
      register: rocky_marker
      changed_when: false
      failed_when: rocky_marker.rc != 0 or rocky_marker.stdout | trim != expected_vm_name
      when: expected_system == 'Rocky'
    - name: Confirmar que el invitado paso las verificaciones
      ansible.builtin.set_fact:
        guest_verified: true
  vars:
    accion: crear_base
    vm_os: Windows
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
- name: Desmontar medios y finalizar despliegue
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion crear_base
    when: accion in ['crear_base', 'finalizar_base']
    block:
    - name: Exigir verificacion antes de limpiar material de instalacion
      ansible.builtin.assert:
        that:
        - hostvars['hv_semaphore_guest'].guest_verified | default(false) | bool
    - name: Desmontar DVDs y borrar solo medios de este despliegue
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Limpiar-Medios.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          Root: '{{ deployment.result.root }}'
          CsvVolumes: '{{ csv_volumes }}'
      register: completed
    - name: Retirar archivo temporal de huellas SSH del runner
      ansible.builtin.file:
        path: '{{ ssh_hosts_file.path }}'
        state: absent
      delegate_to: localhost
      when: vm_os == 'Rocky'
    - name: Informar resultado verificado
      ansible.builtin.debug:
        msg:
        - 'VM nueva: {{ vm_name }} ({{ vm_os }})'
        - 'Nodo propietario: {{ completed.result.owner }}'
        - 'CSV: {{ deployment.result.csv }}'
        - 'IP: {{ vm_ip }}'
        - Instalacion autenticada y verificada; medios temporales retirados.
- name: Sellar Windows mediante PowerShell Direct
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion crear_base
    when: accion in ['crear_base', 'finalizar_base']
    block:
    - name: Exigir verificacion previa de la base recien instalada
      ansible.builtin.assert:
        that:
        - hostvars['hv_semaphore_guest'].guest_verified | default(false) | bool
        - deployment.result.root is defined
    - name: Obtener propietario actual de la base
      ansible.windows.win_powershell:
        script: |
          param([string]$Name)
          $Ansible.Changed=$false
          $Ansible.Result=@{owner=(Get-ClusterGroup -Name $Name).OwnerNode.Name}
        parameters:
          Name: '{{ vm_name }}'
        error_action: stop
      register: base_owner
    - name: Generalizar Windows y solicitar apagado
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Sellar-Windows.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
        sensitive_parameters:
        - name: GuestCredential
          username: '{{ windows_admin_user }}'
          password: '{{ admin_password }}'
      delegate_to: '{{ base_owner.result.owner }}'
      when: vm_os == 'Windows'
      no_log: true
- name: Sellar Rocky y preparar cloud-init para los futuros clones
  hosts: hv_semaphore_guests
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Operacion crear_base
    when: accion in ['crear_base', 'finalizar_base']
    block:
    - name: Preparar y apagar la base Rocky
      when: expected_system == 'Rocky'
      become: false
      block:
      - name: Copiar herramienta de sellado dentro de la base
        ansible.builtin.copy:
          src: ../files/sellar-rocky.sh
          dest: /var/tmp/sellar-rocky-semaphore.sh
          mode: '0700'
      - name: Limpiar identidad, bloquear credenciales maestras y programar apagado
        ansible.builtin.command:
          argv:
          - /bin/bash
          - /var/tmp/sellar-rocky-semaphore.sh
          - '{{ expected_vm_name }}'
  vars:
    accion: crear_base
    vm_os: Windows
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
- name: Publicar disco maestro y liberar la IP de instalacion
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion crear_base
    when: accion in ['crear_base', 'finalizar_base']
    block:
    - name: Esperar apagado y capturar una version nueva de la imagen
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Capturar-Plantilla.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          TemplateId: '{{ template_id }}'
          Sistema: '{{ vm_os }}'
          Library: '{{ template_library }}'
          SourceRoot: '{{ deployment.result.root }}'
          CsvVolumes: '{{ csv_volumes }}'
      register: captured_template
    - name: Liberar la IP solo tras publicar la base apagada
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Bloquear-IPBase.ps1'
        error_action: stop
        parameters:
          Action: Liberar
          Library: '{{ template_library }}'
          VmName: '{{ vm_name }}'
          IPAddress: '{{ vm_ip }}'
          CsvVolumes: '{{ csv_volumes }}'
          Token: '{{ base_ip_lock.result.token }}'
    - name: Informar que la plantilla esta disponible para reutilizar
      ansible.builtin.debug:
        msg: Plantilla {{ template_id }} publicada en {{ captured_template.result.image }}. La VM base queda apagada; los siguientes despliegues
          copian este VHDX.
- name: Crear una VM nueva copiando una imagen base ya instalada
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  pre_tasks:
  - name: Operacion clonar
    when: accion == 'clonar'
    block:
    - name: Validar seleccion de hipervisor, VLAN y plantilla
      ansible.builtin.assert:
        that:
        - ansible_play_hosts_all | length == 1
        - template_id in template_catalog
        - template_catalog[template_id].system == vm_os
        - vm_vlan | int in allowed_vlans
        - vm_name is match('^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$')
        - vm_os != 'Windows' or vm_name | length <= 15
        - memory_gb | int >= 4
        - cpu | int >= 1
        - cpu | int <= 64
        - disk_gb | int >= 100
        - vm_ip != base_install_ip
        - vm_mask | int >= 1
        - vm_mask | int <= 30
        - vm_gateway | length > 0
        - vm_dns1 | length > 0
        fail_msg: Completa la configuracion; 10.138.120.5 esta reservada para instalar las bases.
    - name: Validar credenciales nuevas del invitado
      ansible.builtin.assert:
        that:
        - (vm_os == 'Windows' and admin_password | length > 0) or (vm_os == 'Rocky' and root_password | length > 0 and linux_password | length
          > 0)
      no_log: true
  tasks:
  - name: Operacion clonar
    when: accion == 'clonar'
    block:
    - name: Copiar el VHDX completo y crear VM nueva apagada
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Clonar-Plantilla.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          TemplateId: '{{ template_id }}'
          Sistema: '{{ vm_os }}'
          Library: '{{ template_library }}'
          ClusterNodes: '{{ cluster_nodes }}'
          CsvVolumes: '{{ csv_volumes }}'
          SwitchName: '{{ v_switch | default(clone_switch, true) }}'
          MemoryBytes: '{{ (memory_gb | int) * 1073741824 }}'
          DiskBytes: '{{ (disk_gb | int) * 1073741824 }}'
          CpuCount: '{{ cpu | int }}'
          VlanId: '{{ vm_vlan | int }}'
          ReserveBytes: '{{ (reserve_gb | int) * 1073741824 }}'
      register: deployment
    - name: Copiar herramientas de personalizacion al directorio restringido
      ansible.windows.win_copy:
        src: '{{ playbook_dir }}/../files/bootstrap/'
        dest: '{{ deployment.result.stage }}\'
    - name: Guardar parametros propios de este clon sin contrasenas
      ansible.windows.win_copy:
        content: '{{ {''vm_name'': vm_name, ''vm_ip'': vm_ip, ''vm_mask'': vm_mask | int, ''vm_gateway'': vm_gateway, ''vm_dns1'': vm_dns1, ''vm_dns2'':
          vm_dns2, ''linux_user'': linux_user, ''rdp_port'': rdp_port} | to_nice_json }}'
        dest: '{{ deployment.result.stage }}\vm.json'
    - name: Personalizar Windows offline antes del primer arranque
      ansible.windows.win_powershell:
        script: |
          param([string]$Root, [string]$Stage, [Security.SecureString]$Password)
          & (Join-Path $Stage 'Personalizar-Clon.ps1') -Root $Root -RequestFile (Join-Path $Stage 'vm.json') -AdminPassword $Password
        error_action: stop
        parameters:
          Root: '{{ deployment.result.root }}'
          Stage: '{{ deployment.result.stage }}'
        sensitive_parameters:
        - name: Password
          value: '{{ admin_password }}'
      when: vm_os == 'Windows'
      no_log: true
    - name: Crear semilla cloud-init propia para Rocky
      ansible.windows.win_powershell:
        script: |
          param([string]$Root, [string]$Stage, [string]$Oscdimg, [Security.SecureString]$RootHash, [Security.SecureString]$UserHash)
          & (Join-Path $Stage 'Personalizar-Clon.ps1') -Root $Root -RequestFile (Join-Path $Stage 'vm.json') -RootHash $RootHash -UserHash $UserHash -OscdimgPath $Oscdimg
        error_action: stop
        parameters:
          Root: '{{ deployment.result.root }}'
          Stage: '{{ deployment.result.stage }}'
          Oscdimg: '{{ oscdimg_path }}'
        sensitive_parameters:
        - name: RootHash
          value: '{{ (rocky_password_hashes.stdout | from_json).root }}'
        - name: UserHash
          value: '{{ (rocky_password_hashes.stdout | from_json).user }}'
      when: vm_os == 'Rocky'
      no_log: true
    - name: Registrar el clon en HA e iniciar desde su disco
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Arrancar-Clon.ps1'
        error_action: stop
        parameters:
          Root: '{{ deployment.result.root }}'
    - name: Configurar la red del clon Windows por PowerShell Direct desde el host
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Configurar-RedClon.ps1'
        error_action: stop
        parameters:
          Root: '{{ deployment.result.root }}'
          AdminUser: '{{ windows_admin_user }}'
          TimeoutMinutes: 20
        sensitive_parameters:
        - name: AdminPassword
          value: '{{ admin_password }}'
      when: vm_os == 'Windows'
      register: clone_network
    - name: Mostrar estado de red aplicado al clon Windows
      ansible.builtin.debug:
        var: clone_network.result
      when: vm_os == 'Windows'
    - name: Crear archivo de huellas SSH exclusivo de esta tarea
      ansible.builtin.tempfile:
        state: file
        prefix: semaphore-clone-knownhosts-
      delegate_to: localhost
      when: vm_os == 'Rocky'
      register: ssh_hosts_file
    - name: Registrar invitado con las credenciales especificas del clon
      ansible.builtin.add_host:
        name: hv_semaphore_guest
        groups: hv_semaphore_guests
        ansible_host: '{{ vm_ip }}'
        ansible_connection: '{{ ''winrm'' if vm_os == ''Windows'' else ''ssh'' }}'
        ansible_port: '{{ 5985 if vm_os == ''Windows'' else 22 }}'
        ansible_user: '{{ windows_admin_user if vm_os == ''Windows'' else linux_user }}'
        ansible_password: '{{ admin_password if vm_os == ''Windows'' else linux_password }}'
        ansible_winrm_transport: ntlm
        ansible_winrm_message_encryption: always
        ansible_ssh_common_args: '{{ '''' if vm_os == ''Windows'' else ''-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile='' + ssh_hosts_file.path
          }}'
        expected_instance: '{{ deployment.result.instance_id }}'
        expected_vm_name: '{{ vm_name }}'
        expected_vm_ip: '{{ vm_ip }}'
        expected_system: '{{ vm_os }}'
      no_log: true
- name: Verificar identidad y primer arranque del clon
  hosts: hv_semaphore_guests
  gather_facts: false
  any_errors_fatal: true
  tasks:
  - name: Operacion clonar
    when: accion == 'clonar'
    block:
    - name: Esperar conexion autenticada al sistema ya instalado
      ansible.builtin.wait_for_connection:
        timeout: 1800
        sleep: 10
    - name: Verificar personalizacion Windows
      ansible.windows.win_powershell:
        script: |
          param([string]$Name,[string]$Instance,[string]$IPAddress)
          $Ansible.Changed=$false
          $identity=Get-Content 'C:\ProgramData\Semaphore\instance.json' -Raw | ConvertFrom-Json
          if ($identity.instance_id -ne $Instance -or $env:COMPUTERNAME -ne $Name) { throw 'Identidad Windows no coincide con el clon.' }
          if (-not (Get-NetIPAddress -AddressFamily IPv4 | Where-Object IPAddress -eq $IPAddress)) { throw 'IP Windows no coincide.' }
        error_action: stop
        parameters:
          Name: '{{ expected_vm_name }}'
          Instance: '{{ expected_instance }}'
          IPAddress: '{{ expected_vm_ip }}'
      register: clone_windows_verified
      until: clone_windows_verified is succeeded
      retries: 30
      delay: 5
      when: expected_system == 'Windows'
    - name: Esperar que cloud-init finalice sin errores
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      when: expected_system == 'Rocky'
    - name: Leer identidad nueva de Rocky
      ansible.builtin.command: cat /etc/semaphore-instance.json
      changed_when: false
      register: rocky_instance
      failed_when: rocky_instance.rc != 0 or (rocky_instance.stdout | from_json).instance_id != expected_instance or (rocky_instance.stdout |
        from_json).vm_name != expected_vm_name
      when: expected_system == 'Rocky'
    - name: Retirar respuestas Windows con contrasena temporal
      ansible.windows.win_file:
        path: '{{ item }}'
        state: absent
      loop:
      - C:\Windows\Panther\Unattend.xml
      - C:\Windows\Panther\Unattend\Unattend.xml
      - C:\Windows\Panther\unattend-original.xml
      - C:\ProgramData\Semaphore\Customize.ps1
      when: expected_system == 'Windows'
    - name: Confirmar verificacion del clon
      ansible.builtin.set_fact:
        guest_verified: true
  vars:
    accion: crear_base
    vm_os: Windows
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
- name: Retirar semilla temporal tras verificar el clon
  hosts: '{{ hyperv_host }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion clonar
    when: accion == 'clonar'
    block:
    - name: Exigir verificacion del invitado
      ansible.builtin.assert:
        that:
        - hostvars['hv_semaphore_guest'].guest_verified | default(false) | bool
    - name: Desmontar semilla y limpiar archivos temporales de esta VM
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Limpiar-Medios.ps1'
        error_action: stop
        parameters:
          VmName: '{{ vm_name }}'
          Root: '{{ deployment.result.root }}'
          CsvVolumes: '{{ csv_volumes }}'
      register: completed
    - name: Limpiar archivo temporal de huellas del runner
      ansible.builtin.file:
        path: '{{ ssh_hosts_file.path }}'
        state: absent
      delegate_to: localhost
      when: vm_os == 'Rocky'
    - name: Informar despliegue desde imagen base sin instalar el sistema operativo
      ansible.builtin.debug:
        msg: VM {{ vm_name }} creada desde {{ template_id }}; IP {{ vm_ip }}; propietario {{ completed.result.owner }}. No se uso una ISO de instalacion.
- name: Diagnosticar requisitos de la base sin crear ni modificar VM
  hosts: '{{ hyperv_host | default(''SMXHYPVA'') }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion diagnosticar
    when: accion == 'diagnosticar'
    block:
    - name: Recopilar diagnostico de Hyper-V, CSV y acceso al NAS
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Diagnosticar-Base.ps1'
        depth: 6
        error_action: stop
        parameters:
          VmName: '{{ vm_name | default(''TPL-WS2025'') }}'
          ClusterNodes: '{{ cluster_nodes }}'
          CsvVolumes: '{{ csv_volumes }}'
          SwitchName: '{{ v_switch | default(clone_switch, true) }}'
          IsoPath: '{{ hv_iso_path }}'
          OscdimgPath: '{{ oscdimg_path }}'
          Library: '{{ template_library }}'
          BaseIP: '{{ base_install_ip }}'
        sensitive_parameters: '{{ [{''name'': ''NasCredential'', ''username'': nas_user, ''password'': nas_pass}] if nas_user | length > 0 else
          [] }}'
      register: base_diagnostics
    - name: Mostrar causas comprobadas sin contrasenas
      ansible.builtin.debug:
        var: base_diagnostics.result
- name: Archivar un bloqueo de preparacion fallida sin borrar recursos
  hosts: '{{ hyperv_host | default(''SMXHYPVA'') }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion recuperar_reserva
    when: accion == 'recuperar_reserva'
    block:
    - name: Exigir el identificador del intento fallido y la fecha exacta del bloqueo
      ansible.builtin.assert:
        that:
        - ansible_play_hosts_all | length == 1
        - failed_task_id | default(0) | int > 0
        - expected_lock_created | default('') | length > 0
        - vm_name is match('^TPL-[a-zA-Z0-9-]+$')
    - name: Archivar solo antes de crear VM y conservando los medios del intento
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Archivar-BloqueoFallido.ps1'
        error_action: stop
        parameters:
          Library: '{{ template_library }}'
          CsvVolumes: '{{ csv_volumes }}'
          ClusterNodes: '{{ cluster_nodes }}'
          VmName: '{{ vm_name }}'
          IPAddress: '{{ base_install_ip }}'
          ExpectedCreated: '{{ expected_lock_created }}'
          FailedTaskId: '{{ failed_task_id | int }}'
          PreparationRoot: '{{ failed_preparation_root | default('''') }}'
      register: recovered_lock
    - name: Mostrar registro conservado y disponibilidad para reintentar
      ansible.builtin.debug:
        var: recovered_lock.result
- name: Retirar solo la base Windows de prueba expresamente autorizada
  hosts: '{{ hyperv_host | default(''SMXHYPVA'') }}'
  gather_facts: false
  any_errors_fatal: true
  vars_files:
  - ../config/cluster.yml
  - ../config/plantillas.yml
  vars:
    accion: crear_base
    vm_os: Windows
    ansible_winrm_transport: credssp
  tasks:
  - name: Operacion limpiar
    when: accion == 'limpiar'
    block:
    - name: Validar un solo ejecutor e identidad exacta del intento
      ansible.builtin.assert:
        that:
        - ansible_play_hosts_all | length == 1
        - expected_vm_id | default('') | length > 0
        - expected_lock_created | default('') | length > 0
        - cleanup_root | default('') | length > 0
    - name: Validar o eliminar exclusivamente TPL-WS2025 y sus archivos
      ansible.windows.win_powershell:
        path: '{{ playbook_dir }}/../scripts/Eliminar-BasePrueba.ps1'
        error_action: stop
        parameters:
          Root: '{{ cleanup_root }}'
          CsvVolumes: '{{ csv_volumes }}'
          Library: '{{ template_library }}'
          ExpectedVMId: '{{ expected_vm_id }}'
          ExpectedLockCreated: '{{ expected_lock_created }}'
          Apply: '{{ cleanup_apply | default(false) | bool }}'
      register: cleanup_result
    - name: Mostrar resultado sin secretos
      ansible.builtin.debug:
        var: cleanup_result.result
