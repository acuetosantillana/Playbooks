---
- name: Archivar un bloqueo de preparacion fallida sin borrar recursos
  hosts: "{{ hyperv_host | default('SMXHYPVA') }}"
  gather_facts: false
  any_errors_fatal: true
  vars_files: [../config/cluster.yml, ../config/plantillas.yml]
  vars:
    ansible_winrm_transport: credssp
  tasks:
    - name: Exigir el identificador del intento fallido y la fecha exacta del bloqueo
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - failed_task_id | default(0) | int > 0
          - expected_lock_created | default('') | length > 0
          - vm_name is match('^TPL-[a-zA-Z0-9-]+$')
    - name: Archivar solo antes de crear VM y conservando los medios del intento
      ansible.windows.win_powershell:
        path: "{{ playbook_dir }}/../scripts/Archivar-BloqueoFallido.ps1"
        error_action: stop
        parameters:
          Library: "{{ template_library }}"
          CsvVolumes: "{{ csv_volumes }}"
          ClusterNodes: "{{ cluster_nodes }}"
          VmName: "{{ vm_name }}"
          IPAddress: "{{ base_install_ip }}"
          ExpectedCreated: "{{ expected_lock_created }}"
          FailedTaskId: "{{ failed_task_id | int }}"
          PreparationRoot: "{{ failed_preparation_root | default('') }}"
      register: recovered_lock
    - name: Mostrar registro conservado y disponibilidad para reintentar
      ansible.builtin.debug:
        var: recovered_lock.result
