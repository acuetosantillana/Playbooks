---
- ansible.builtin.import_playbook: reservar_base.yml
  vars: &base_windows
    vm_os: Windows
    solo_base: true
    vm_name: TPL-WS2025
    template_id: ws2025-base-v1
    vm_ip: 10.138.120.5
    vm_vlan: 120
    vm_mask: 24
    memory_gb: 8
    cpu: 4
    disk_gb: 100
    v_switch: SETvSwitch
    vm_image_index: 2
- ansible.builtin.import_playbook: desplegar.yml
  vars: *base_windows
- ansible.builtin.import_playbook: sellar_y_capturar.yml
  vars: *base_windows
