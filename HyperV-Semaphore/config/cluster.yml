---
cluster_nodes: [SMXHYPVA, SMXHYPVB]
default_switch: LAN-Prod
csv_volumes:
  - 'C:\ClusterStorage\Volume1'
  - 'C:\ClusterStorage\Volume2'
  - 'C:\ClusterStorage\Volume3'
  - 'C:\ClusterStorage\Volume4'
  - 'C:\ClusterStorage\Volume5'
  - 'C:\ClusterStorage\Volume6'
  - 'C:\ClusterStorage\Volume7'
oscdimg_path: 'C:\Oscdimg\oscdimg.exe'
windows_automatic_boot: true
# false: usar la ISO original de Rocky tal cual (GRUB arranca solo por timeout de 60 s
# y el Kickstart va en OEMDRV). true: reconstruir la ISO en el runner para seleccionar
# Install a los 3 s, lo que requiere transferir ~30 GB por WinRM y tarda mas de una hora.
rocky_automatic_iso: false
# Vacio: buscar en la ISO, junto a oscdimg.exe y en Deployment Tools del ADK.
efisys_noprompt_path: ''
windows_iso_default: '\\10.138.120.130\isos\SERVER_EVAL_x64FRE_es-es.iso'
rocky_iso_default: '\\10.138.120.130\isos\Rocky-9-x86_64-dvd.iso'
windows_ui_language: es-ES
windows_admin_user: Administrador
rdp_port: 4502
linux_user: adm
vm_dns2: ''
vm_vlan: 0
reserve_gb: 10
install_timeout: 3600
# Los secretos pueden venir del grupo de variables de Semaphore como entorno.
# Tambien se aceptan extra-vars/Vault con estos nombres, sin guardarlos en Git.
nas_user: "{{ iso_user | default(lookup('ansible.builtin.env', 'HV_NAS_USER'), true) }}"
nas_pass: "{{ iso_password | default(lookup('ansible.builtin.env', 'HV_NAS_PASSWORD'), true) }}"
admin_password: "{{ lookup('ansible.builtin.env', 'HV_WINDOWS_PASSWORD') }}"
root_password: "{{ lookup('ansible.builtin.env', 'HV_ROOT_PASSWORD') }}"
linux_password: "{{ lookup('ansible.builtin.env', 'HV_LINUX_PASSWORD') }}"
